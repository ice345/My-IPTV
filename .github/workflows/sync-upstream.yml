name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream while keeping local paths
        id: sync
        continue-on-error: true
        env:
          UPSTREAM_REPO: https://github.com/kakaxi-1/IPTV.git
          KEEP_PATHS: app LOGO pull CNAME egg.xml index.html .github/workflows/sync-upstream.yml scripts/txt_to_m3u.py
        run: |
          set -euo pipefail

          worktree="$(pwd)"
          keep_dir="$(mktemp -d)"
          mkdir -p "$keep_dir/paths"
          echo "$keep_dir" > /tmp/keep_dir

          for path in $KEEP_PATHS; do
            if [ -e "$path" ]; then
              mkdir -p "$keep_dir/paths/$(dirname "$path")"
              cp -a "$path" "$keep_dir/paths/$path"
            fi
          done

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_REPO"
          git fetch upstream

          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          if [ -z "$upstream_branch" ]; then
            upstream_branch="main"
          fi
          echo "$upstream_branch" > /tmp/upstream_branch

          if ! git merge --no-edit -X theirs "upstream/$upstream_branch"; then
            git diff --name-only --diff-filter=U > /tmp/sync_conflicts || true

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git checkout --theirs -- "$path" 2>/dev/null || git rm -f -- "$path"
            done < /tmp/sync_conflicts

            git add -A
            if git diff --name-only --diff-filter=U | grep -q .; then
              git merge --abort || true
              exit 1
            fi

            git commit --no-edit
          fi

          for path in $KEEP_PATHS; do
            rm -rf "$path"
          done

          cd "$keep_dir/paths"
          find . -mindepth 1 -maxdepth 1 -exec cp -a {} "$worktree"/ \;
          cd "$worktree"

      - name: Convert txt playlists to m3u
        if: steps.sync.outcome == 'success'
        run: python3 scripts/txt_to_m3u.py .

      - name: Commit and push changes
        if: steps.sync.outcome == 'success'
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit 0
          fi

          git commit -m "Sync upstream and convert playlists"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create conflict pull request
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_PATHS: app LOGO pull CNAME egg.xml index.html .github/workflows/sync-upstream.yml scripts/txt_to_m3u.py
        run: |
          set -euo pipefail

          upstream_branch="$(cat /tmp/upstream_branch 2>/dev/null || echo main)"
          conflict_branch="sync-upstream-conflict-${GITHUB_RUN_ID}"
          keep_dir="$(cat /tmp/keep_dir)"

          git checkout -B "$conflict_branch"
          if ! git merge --no-edit -X theirs "upstream/$upstream_branch"; then
            git diff --name-only --diff-filter=U > /tmp/sync_conflicts || true

            while IFS= read -r path; do
              [ -n "$path" ] || continue
              git checkout --theirs -- "$path" 2>/dev/null || git rm -f -- "$path" || true
            done < /tmp/sync_conflicts

            git add -A
            git commit --no-edit || true
          fi

          for path in $KEEP_PATHS; do
            rm -rf "$path"
          done

          cd "$keep_dir/paths"
          find . -mindepth 1 -maxdepth 1 -exec cp -a {} "$GITHUB_WORKSPACE"/ \;
          cd "$GITHUB_WORKSPACE"

          python3 scripts/txt_to_m3u.py .

          {
            echo "# Upstream sync needs review"
            echo
            echo "The automatic merge hit conflicts. This branch was generated with upstream changes preferred for conflicting files, then local protected paths were restored."
            echo
            echo "Conflicted files from the first merge attempt:"
            echo
            if [ -s /tmp/sync_conflicts ]; then
              sed 's/^/- /' /tmp/sync_conflicts
            else
              echo "- Unknown"
            fi
          } > SYNC_CONFLICTS.md

          git add -A
          git commit -m "Create upstream sync review branch" || true
          git push --force-with-lease origin "$conflict_branch"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$conflict_branch" \
            --title "Review upstream sync conflicts" \
            --body-file SYNC_CONFLICTS.md
