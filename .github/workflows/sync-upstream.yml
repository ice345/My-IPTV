name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream while keeping local paths
        env:
          UPSTREAM_REPO: https://github.com/kakaxi-1/IPTV.git
          KEEP_PATHS: app LOGO pull CNAME egg.xml index.html .github/workflows/sync-upstream.yml scripts/txt_to_m3u.py
        run: |
          set -euo pipefail

          worktree="$(pwd)"
          keep_dir="$(mktemp -d)"
          upstream_dir="$(mktemp -d)"
          mkdir -p "$keep_dir/paths"

          for path in $KEEP_PATHS; do
            if [ -e "$path" ]; then
              mkdir -p "$keep_dir/paths/$(dirname "$path")"
              cp -a "$path" "$keep_dir/paths/$path"
            fi
          done

          upstream_branch="$(git ls-remote --symref "$UPSTREAM_REPO" HEAD | sed -n 's#^ref: refs/heads/\\(.*\\)[[:space:]]HEAD#\\1#p')"
          if [ -z "$upstream_branch" ]; then
            upstream_branch="main"
          fi

          git clone --depth 1 --branch "$upstream_branch" "$UPSTREAM_REPO" "$upstream_dir/repo"

          rsync -a --delete \
            --exclude ".git/" \
            --exclude "app/***" \
            --exclude "LOGO/***" \
            --exclude "pull/***" \
            --exclude "CNAME" \
            --exclude "egg.xml" \
            --exclude "index.html" \
            --exclude ".github/workflows/sync-upstream.yml" \
            --exclude "scripts/txt_to_m3u.py" \
            "$upstream_dir/repo/" "$worktree/"

          cd "$keep_dir/paths"
          if [ "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
            find . -mindepth 1 -maxdepth 1 -exec cp -a {} "$worktree"/ \;
          fi

      - name: Convert txt playlists to m3u
        run: python3 scripts/txt_to_m3u.py .

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            git push origin "HEAD:${GITHUB_REF_NAME}"
            exit 0
          fi

          git commit -m "Sync upstream and convert playlists"
          git push origin "HEAD:${GITHUB_REF_NAME}"
